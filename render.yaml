services:
  - type: web
    name: app-latin
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_DURATION_DAYS
        value: 30
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        value: gpt-5.5
      - key: AI_FALLBACK_TO_MOCK
        value: true
