<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Latin</title>
  </head>
  <body>
    <div id="root">
      <main
        id="app-boot-placeholder"
        style="min-height:100vh;display:grid;place-items:center;background:#f5f0e6;color:#34291f;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box"
      >
        <section style="max-width:520px;text-align:center">
          <p style="font-size:32px;margin:0 0 12px" aria-hidden="true">L</p>
          <p style="margin:0">Preparando tu espacio de práctica…</p>
        </section>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var placeholder = document.getElementById('app-boot-placeholder')
        if (!placeholder) return

        placeholder.querySelector('section').innerHTML =
          '<p style="font-size:32px;margin:0 0 12px" aria-hidden="true">L</p>' +
          '<h1 style="font-size:22px;margin:0 0 10px">No se pudo iniciar la aplicación</h1>' +
          '<p style="margin:0;line-height:1.5">Actualiza la página. Si el problema continúa, abre la dirección en una ventana privada.</p>'
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
